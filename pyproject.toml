[project]
name = "cas-dl-cv"
version = "0.1.1"
description = "CAS Deep Learning - Computer Vision HS2026"
authors = [{ name = "Marco Willi", email = "marco.willi@fhnw.ch" }]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
  # Core
  "numpy",
  "pillow",
  "scikit-learn",
  # Visualization
  "matplotlib",
  "seaborn",
  # jupyter & notebooks
  "ipywidgets>=8",
  "ipykernel>=6.30.1,<7",
  "jupyter",
  "jupyterlab",
  "jupyter-cache",
  # CV/ML core
  "scikit-image",
  "timm",
  "torch",
  "torchvision",
  "torchmetrics",
  "lightning",
  "transformers",
  "opencv-python-headless",
  "mlxtend",
  "kornia",
  # --- generative ai --- #
  "openai>=2.1.0,<3",
  "replicate>=1.0.7,<2",
  "diffusers",
  "accelerate",
  "bitsandbytes",
  "datasets",
  "sentencepiece",
  # --- experiment tracking --- #
  "tensorboard",
  # visualization extras
  "plotly",
  "altair",
  # handy tools
  "gdown",
  "torchshow",
  "torchviz",
  "torchinfo",
  "visualtorch",
  "tabulate",
  "python-dotenv",
  "pyrootutils",
]

[dependency-groups]
dev = ["ruff", "pre-commit", "pytest", "mypy", "rich"]
ci = [
  "torch",
  "torchvision",
  "jupyter",
  "torchinfo",
  "matplotlib",
  "numpy",
  "scikit-learn",
  "mlxtend",
  "seaborn",
  "jupyter-cache",
  "plotly",
  "torchshow",
  "torchviz",
  "visualtorch",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
