<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convolution Parameters: Kernel Size, Padding, Stride, Dilation</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<!--
  Interactive demo: how kernel size, zero-padding, stride and dilation shape the output of a
  convolution. No dependencies, no backend; works from file:// and on GitHub Pages.
  Embed in Quarto pages / Reveal.js slides via iframe:

    <iframe src="../../demos/cnns/convolution_parameters/index.html" width="100%" height="700"
            style="border: 1px solid #ddd; border-radius: 6px;"
            title="Interactive demo: convolution parameters"></iframe>

  Presets and defaults: config.js. Computation: conv.js. Exercises: exercises.js.
  Interface: app.js. Formulas are typeset with KaTeX from ../vendor/katex/.
-->
<style>
  :root {
    --ink: #1f2328;
    --muted: #667085;
    --line: #d5d9e0;
    --panel: #f6f7f9;
    --accent: #e8910c;
    --neg: #2166ac;
    --zero: #f7f7f7;
    --pos: #b2182b;
    --cell: 16px; /* side of one input/output cell, set by app.js */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Font size follows the iframe so the demo stays readable on large slides and still fits
     into a fixed-height frame. */
  html { font-size: clamp(13px, min(1.55vw, 2.4vh), 22px); }
  html.auto-height { font-size: clamp(13px, 1.55vw, 22px); }
  body {
    margin: 0;
    padding: 0.7rem 1rem;
    background: #fff;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.35;
  }
  header h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 0.1rem 0 0.5rem; font-size: 0.8rem; color: var(--muted); }

  button, select, input { font: inherit; color: inherit; }
  button, select {
    padding: 0.2rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    background: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--panel); }

  /* Parameter controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 1.1rem;
    margin-bottom: 0.6rem;
    font-size: 0.85rem;
  }
  .control { display: flex; align-items: center; gap: 0.4rem; }
  .control > span { color: var(--muted); }
  .seg { display: flex; }
  .seg button { min-width: 2rem; border-radius: 0; margin-left: -1px; font-variant-numeric: tabular-nums; }
  .seg button:first-child { border-radius: 0.3rem 0 0 0.3rem; margin-left: 0; }
  .seg button:last-child { border-radius: 0 0.3rem 0.3rem 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .controls label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
  .controls .spacer { flex: 1; }

  /* Three panels: input, kernel, output */
  .panels {
    display: grid;
    grid-template-columns: max-content 15rem max-content;
    justify-content: space-between;
    gap: 1rem;
    align-items: start;
  }
  .panel h2 {
    margin: 0 0 0.35rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .panel h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .panel-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.3rem 0.5rem;
    margin-top: 0.4rem;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .panel-foot select { max-width: 100%; }

  /* A stage always reserves room for the largest grid, so that the layout does not jump
     and differences in size stay visible. */
  .stage {
    display: grid;
    place-items: center;
    width: calc(var(--cell) * var(--max-cells));
    height: calc(var(--cell) * var(--max-cells));
    background: var(--panel);
    border-radius: 0.3rem;
  }
  .panel.input, .panel.output { width: calc(var(--cell) * var(--max-cells)); }
  .grid { position: relative; display: grid; grid-template-columns: repeat(var(--n), var(--cell)); }
  .cell {
    display: grid;
    place-items: center;
    width: var(--cell);
    height: var(--cell);
    border: 1px solid rgba(120, 128, 140, 0.45);
    font-size: calc(var(--cell) * 0.32);
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    user-select: none;
  }
  body:not(.show-values) .cell { font-size: 0; }
  .cell.pad {
    border: 1px dashed #9aa3b2;
    background: repeating-linear-gradient(45deg, #000 0 3px, #5d6470 3px 4px);
  }
  .cell.sampled, .cell.selected {
    border: 2px solid var(--accent);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9);
  }
  /* Extent of the (dilated) kernel on the input. */
  .extent {
    position: absolute;
    border: 2px dashed var(--accent);
    pointer-events: none;
  }
  #output-grid { cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #output-grid:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .message {
    margin: 0;
    padding: 0.8rem;
    font-size: 0.85rem;
    text-align: center;
    color: var(--pos);
  }
  .message b { display: block; margin-bottom: 0.3rem; }

  /* Kernel editor */
  .panel.kernel select { width: 100%; font-size: 0.85rem; }
  .weights {
    display: grid;
    grid-template-columns: repeat(var(--k), 1fr);
    gap: 0.2rem;
    margin: 0.5rem 0;
  }
  .weights[data-k="1"] { width: 34%; margin-inline: auto; }
  .weights[data-k="5"] { gap: 0.12rem; font-size: 0.72rem; }
  .weights[data-k="7"] { gap: 0.08rem; font-size: 0.6rem; }
  .weights[data-k="5"] input, .weights[data-k="7"] input { padding: 0.3rem 0; }
  .weights input {
    width: 100%;
    padding: 0.4rem 0;
    border: 1px solid var(--line);
    border-radius: 0.25rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .weights input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .weights input:focus { position: relative; z-index: 1; outline: 2px solid var(--ink); }
  .weights[data-k="5"] input:focus, .weights[data-k="7"] input:focus { transform: scale(1.6); }
  .weights input.invalid { outline: 2px solid var(--pos); }
  .kernel-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.78rem; color: var(--muted); }
  .notice {
    margin: 0.4rem 0 0;
    padding: 0.3rem 0.5rem;
    border-radius: 0.3rem;
    font-size: 0.78rem;
  }
  .notice:not(:empty) { background: #fff4de; border: 1px solid var(--accent); }
  .notice.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: var(--accent); } to { background: #fff4de; } }

  /* Legends */
  .legend { flex: 1; min-width: 6rem; }
  .legend-bar { height: 0.55rem; border: 1px solid var(--line); }
  .legend-bar.diverging { background: linear-gradient(to right, var(--neg), var(--zero), var(--pos)); }
  .legend-bar.gray { background: linear-gradient(to right, #000, #fff); }
  .legend-ticks { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .swatch { display: inline-block; width: 0.9rem; height: 0.9rem; vertical-align: -0.15rem; }
  .clip { flex-basis: 100%; min-height: 1.1rem; color: var(--pos); }

  /* Output size, effective kernel size, number of weights */
  .facts {
    margin: 0.6rem 0 0;
    padding: 0.5rem 0.7rem;
    border-radius: 0.4rem;
    background: var(--panel);
    font-size: 0.85rem;
  }
  .facts div { display: flex; flex-wrap: wrap; gap: 0 0.5rem; }
  .facts dt { min-width: 9.5rem; color: var(--muted); }
  .facts div { align-items: center; padding: 0.1rem 0; }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .facts .katex, .calc .katex { font-size: 1.05em; }
  .facts .bad { color: var(--pos); font-weight: 600; }

  /* Calculation for the selected output cell */
  .calc {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 0.7rem;
    margin-top: 0.6rem;
    padding: 0.5rem 0.7rem;
    border-radius: 0.4rem;
    background: var(--panel);
    font-size: 0.85rem;
  }
  .calc .where { flex-basis: 100%; font-size: 0.8rem; }
  .calc .where span { color: var(--muted); }
  .calc figure { margin: 0; text-align: center; }
  .calc figcaption { font-size: 0.7rem; color: var(--muted); }
  .mini {
    display: grid;
    grid-template-columns: repeat(var(--k), var(--mini));
    gap: 1px;
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    --mini: 3.1rem;
  }
  .mini[data-k="5"] { --mini: 2.5rem; font-size: 0.68rem; }
  .mini[data-k="7"] { --mini: 2.1rem; font-size: 0.6rem; }
  .mini span { padding: 0.1rem 0; background: #fff; border: 1px solid var(--line); }
  .mini[data-k="7"] span { padding: 0; }
  .mini span.pad { border-style: dashed; color: var(--muted); background: transparent; }
  .calc .op { font-size: 1.1rem; }
  .calc .result { font-variant-numeric: tabular-nums; }
  .calc .result b { font-size: 1.05rem; }

  /* Exercises */
  .tasks {
    margin-top: 0.6rem;
    padding: 0.4rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 0.4rem;
    font-size: 0.85rem;
  }
  .tasks > summary { cursor: pointer; font-weight: 600; }
  .tasks > summary span { font-weight: 400; color: var(--muted); }
  .tasks ol { margin: 0.4rem 0 0.2rem; padding: 0; list-style: none; display: grid; gap: 0.4rem; }
  .tasks li { display: grid; grid-template-columns: 1.4rem 1fr; gap: 0 0.3rem; }
  .tasks .status {
    display: grid;
    place-items: center;
    width: 1.15rem;
    height: 1.15rem;
    border: 2px solid var(--line);
    border-radius: 50%;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
  }
  .tasks li.done .status { background: #2e7d32; border-color: #2e7d32; }
  .tasks li.done b { color: #2e7d32; }
  .tasks details { grid-column: 2; font-size: 0.8rem; color: var(--muted); }
  .tasks details summary { cursor: pointer; width: max-content; }

  /* Wide frames (slides): formulas and calculation side by side leave more room for the grids. */
  @media (min-width: 1250px) {
    .below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 0 0.8rem; }
    .calc { align-content: start; }
  }
  @media (max-width: 620px) {
    .panels { grid-template-columns: 1fr; justify-items: center; }
    .panel.kernel { width: min(100%, 15rem); }
  }
</style>
</head>
<body>

<header>
  <h1>Convolution Parameters</h1>
  <p>Change kernel size, zero-padding, stride and dilation and observe the output.
     Hover over or tap an output cell to see which input cells it reads.</p>
</header>

<div class="controls">
  <div class="control"><span id="label-k">Kernel size</span><div class="seg" id="ctl-kernelSize" role="group" aria-labelledby="label-k"></div></div>
  <div class="control"><span id="label-p">Padding</span><div class="seg" id="ctl-padding" role="group" aria-labelledby="label-p"></div></div>
  <div class="control"><span id="label-s">Stride</span><div class="seg" id="ctl-stride" role="group" aria-labelledby="label-s"></div></div>
  <div class="control"><span id="label-d">Dilation</span><div class="seg" id="ctl-dilation" role="group" aria-labelledby="label-d"></div></div>
  <label><input id="relu" type="checkbox"> Apply ReLU</label>
  <span class="spacer"></span>
  <button id="reset" type="button">Reset</button>
</div>

<div class="panels" id="panels">
  <section class="panel input">
    <h2>Input <span id="input-size"></span></h2>
    <div class="stage"><div class="grid" id="input-grid" aria-label="Input with zero-padding"></div></div>
    <div class="panel-foot">
      <select id="input-preset" aria-label="Input pattern"></select>
      <div class="legend">
        <div class="legend-bar gray"></div>
        <div class="legend-ticks"><span>0</span><span>1</span></div>
      </div>
      <span><span class="swatch cell pad"></span> zero-padding</span>
    </div>
  </section>

  <section class="panel kernel" id="kernel-panel">
    <h2>Kernel <span id="kernel-size"></span></h2>
    <select id="filter-preset" aria-label="Filter preset"></select>
    <div class="weights" id="weights"></div>
    <div class="kernel-foot">
      <span id="kernel-state"></span>
      <button id="restore" type="button">Restore preset</button>
    </div>
    <p class="notice" id="notice" role="status" aria-live="polite"></p>
  </section>

  <section class="panel output">
    <h2>Output <span id="output-size"></span></h2>
    <div class="stage" id="output-stage">
      <div class="grid" id="output-grid" tabindex="0" aria-label="Output feature map; arrow keys move the selection"></div>
      <p class="message" id="message" hidden></p>
    </div>
    <div class="panel-foot">
      <div class="legend">
        <div class="legend-bar diverging"></div>
        <div class="legend-ticks"><span id="legend-min"></span><span>0</span><span id="legend-max"></span></div>
      </div>
      <button id="rescale" type="button" title="Fit the colour range to the current output">Rescale</button>
      <span class="clip" id="clip"></span>
    </div>
  </section>
</div>

<div class="below">
  <dl class="facts" id="facts"></dl>
  <div class="calc" id="calc"></div>
</div>

<details class="tasks" id="tasks">
  <summary>Exercises <span id="tasks-progress"></span></summary>
  <ol id="task-list"></ol>
</details>

<script src="../vendor/katex/katex.min.js"></script>
<script src="config.js"></script>
<script src="conv.js"></script>
<script src="exercises.js"></script>
<script src="app.js"></script>
</body>
</html>
