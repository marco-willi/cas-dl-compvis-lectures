<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Generative Models Sample an Image</title>
<!--
  Illustrative demo: how autoregressive models, GANs, VAEs, diffusion and flow matching produce
  an image. The steps are computed from fixed images (revealing patches, adding noise);
  they are not produced by the models shown. No dependencies, no backend, no network requests;
  works from file:// and on GitHub Pages. ?family=ar|gan|vae|diffusion|fm selects the model
  family, ?paths=1 turns on the pixel paths (diffusion, flow matching), ?embed=1 hides the title and the tabs (for slides):

    <iframe data-src="../../demos/genai_models/image_sampling/index.html?family=diffusion&embed=1"
            width="100%" height="600" style="border: 1px solid #ddd; border-radius: 6px;"
            title="Interactive demo: diffusion sampling"></iframe>

  Texts: config.js. Data: data/images.js (generated by tools/build_data.py). Computation: sampling.js.
  Interface: app.js.
-->
<style>
  :root {
    --ink: #1f2328;
    --muted: #5b6472;
    --line: #d5d9e0;
    --panel: #f6f7f9;
    /* Same colors as the lecture figures: data = blue, model / noise = orange, networks = green. */
    --target: #1f4e9c;
    --model: #d55e00;
    --model-fill: #fbd9c2;
    --model-ink: #7c2d12;
    --net: #d9ead3;
    --net-stroke: #6b6b6b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { font-size: clamp(14px, 1.55vw, 18px); }
  body {
    margin: 0;
    padding: 0.7rem 1rem;
    background: #fff;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
  }
  header h1 { margin: 0; font-size: 1.15rem; }
  #subtitle { margin: 0.1rem 0 0.6rem; font-size: 0.9rem; color: var(--muted); }
  noscript p { padding: 0.5rem 0.7rem; border: 1px solid var(--model); border-radius: 0.3rem; background: var(--model-fill); }

  button {
    font: inherit;
    color: inherit;
    padding: 0.2rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    background: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--panel); }
  button:disabled { opacity: 0.4; cursor: default; background: #fff; }
  button.primary { border-color: var(--model); color: var(--model-ink); background: var(--model-fill); font-weight: 600; }
  button.primary:hover { background: #f8c7a5; }
  button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  nav { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.7rem; font-size: 0.9rem; }

  /* Stage: inputs | network | output, the same for every family */
  .stage { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
  .node { margin: 0; text-align: center; flex: 0 1 auto; min-width: 0; transition: opacity 0.2s; }
  .node canvas { display: block; width: 100%; border-radius: 0.25rem; }
  .node.big { flex-basis: 46%; }
  .node.small { flex-basis: 19%; }
  .node.bars { flex-basis: 30%; }
  .node.bars canvas { aspect-ratio: 16 / 9; }
  .node.latent { flex-basis: 26%; }
  .node.paths { flex-basis: 27%; }
  .node.paths canvas { aspect-ratio: 1 / 1; }
  .node.latent canvas { aspect-ratio: 5 / 4; }
  .node figcaption { margin-top: 0.25rem; font-size: 0.85rem; color: var(--muted); }
  .node.off { opacity: 0.25; }
  .net {
    flex: 0 0 auto;
    padding: 0.6rem 0.7rem;
    border: 1.5px solid var(--net-stroke);
    border-radius: 0.5rem;
    background: var(--net);
    text-align: center;
    font-size: 1rem;
    transition: opacity 0.2s;
  }
  .net small { display: block; font-size: 0.75rem; color: var(--muted); }
  .net.fixed { background: #fff; border-style: dashed; }
  .net.off { opacity: 0.25; }
  .arrow { flex: 0 0 auto; color: var(--muted); font-size: 1.3rem; }

  /* Strip: intermediate states (diffusion, flow matching) or previous samples (GAN) */
  .strip { display: flex; justify-content: center; gap: 0.4rem; margin-top: 0.6rem; }
  .strip figure { margin: 0; flex: 0 1 15%; text-align: center; }
  .strip canvas { display: block; width: 100%; border-radius: 0.2rem; border: 2px solid transparent; }
  .strip figure.current canvas { border-color: var(--model); }
  .strip figcaption { font-size: 0.75rem; color: var(--muted); }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.6rem; margin-top: 0.7rem; font-size: 0.9rem; }
  .actions .seg { display: inline-flex; gap: 0.2rem; }
  .actions .spacer { flex: 1; }
  .slider { display: flex; align-items: center; gap: 0.4rem; flex: 1 1 14rem; }
  .slider input { flex: 1; accent-color: var(--model); }
  .slider output { min-width: 6.5rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  .check { display: flex; align-items: center; gap: 0.3rem; color: var(--muted); }
  .check input { accent-color: var(--model); }
  #evals { color: var(--muted); font-variant-numeric: tabular-nums; }
  #evals b { color: var(--ink); }
  .note { margin: 0.5rem 0 0; font-size: 0.75rem; color: var(--muted); }
  .note a { color: var(--muted); }
</style>
</head>
<body>
<noscript><p>This demo needs JavaScript.</p></noscript>
<header id="head">
  <h1>How Generative Models Sample an Image</h1>
</header>
<nav id="tabs" aria-label="Model family"></nav>
<p id="subtitle"></p>
<main>
  <div class="stage" id="stage"></div>
  <div class="strip" id="strip"></div>
</main>
<div class="actions">
  <span class="seg" id="modes"></span>
  <label class="slider" id="sliderWrap">
    <input type="range" id="slider" min="0" max="50" value="0" aria-label="Generation progress">
    <output id="sliderOut"></output>
  </label>
  <button id="back" hidden aria-label="Previous token">◀ Back</button>
  <button id="next" hidden aria-label="Next token">Next token ▶</button>
  <button id="play">Play</button>
  <button id="newSample" class="primary">New sample</button>
  <button id="reset">Reset</button>
  <button id="rerun" hidden>Run again (same noise)</button>
  <label class="check" id="pathsWrap" hidden><input type="checkbox" id="showPaths"> Compare paths</label>
  <span class="spacer"></span>
  <span id="evals"></span>
</div>
<p class="note">Illustration: the steps are computed from fixed images, not produced by the models shown. <a id="openFull" href="index.html" target="_blank" hidden>Open in new tab</a></p>
<script src="config.js"></script>
<script src="data/images.js"></script>
<script src="sampling.js"></script>
<script src="app.js"></script>
</body>
</html>
