project:
  type: website
  output-dir: _output
  resources:
    - course_notes.md
    - assets/datasets/**
    - demos/convolution/**
    - demos/cnns/augmentation_stability/**
    - demos/cnns/cnns_vs_mlp_demo/**
    - "!demos/cnns/cnns_vs_mlp_demo/archive/**"
    - "!demos/cnns/cnns_vs_mlp_demo/tools/**"
    - demos/cnns/convolution_parameters/**
    - demos/cnns/receptive_field/**
    - demos/cnns/vendor/**
    - "!demos/cnns/*/tests/**"
    - "!demos/cnns/*/README.md"
    - demos/classification/softmax_explorer/**
    - "!demos/classification/*/tests/**"
    - "!demos/classification/*/README.md"
    - demos/downstream_adaptation/lora_rank_explorer/**
    - "!demos/downstream_adaptation/*/tests/**"
    - "!demos/downstream_adaptation/*/README.md"
    - demos/genai_intro/distribution_fitting/**
    - demos/genai_intro/fid_precision_recall/**
    - "!demos/genai_intro/*/tests/**"
    - "!demos/genai_intro/*/README.md"
    - demos/genai_models/generative_paths/**
    - "!demos/genai_models/*/tests/**"
    - "!demos/genai_models/*/tools/**"
    - "!demos/genai_models/*/README.md"
    - demos/vision_transformers/attention_explorer/**
    - "!demos/vision_transformers/*/tools/**"
    - "!demos/vision_transformers/*/README.md"
    - demos/representation_learning/patch_similarity/**
    - "!demos/representation_learning/*/tools/**"
    - "!demos/representation_learning/*/README.md"
    - demos/welcome/hero_similarity/**
    - "!demos/welcome/*/tools/**"
  render:
    #- "*.qmd"
    - pages/lectures/*.qmd
    - pages/background/*.qmd
    - pages/misc/*.qmd
    - pages/slides/*.qmd
    - "index.qmd"
    - "!NOTES.md"
    - "!demos/*"
  # Generates course_notes.md (lecture notes and quiz as one Markdown file, gitignored)
  pre-render:
    - scripts/build_course_notes.py

author: "Marco Willi"
affiliation: "Institute for Data Science I4DS, FHNW"

execute:
  freeze: True

pdf-engine: xelatex

website:
  page-navigation: true
  title: "CAS Deep Learning - Computer Vision"
  description: "Homepage for CAS Deep Learning - Computer Vision (Part1) with reading materials and exercises"
  favicon: "/assets/cv_logo_small.png"

  site-url: "https://marco-willi.github.io/cas-dl-compvis-lectures/"
  repo-url: https://github.com/marco-willi/cas-dl-compvis-lectures
  repo-actions: [issue]

  google-analytics: "G-0D0M41JVKL"

  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; Copyright 2026, Marco Willi"
    #background: "#D9E3E4"

  sidebar:
    logo: "/assets/cv_logo_small.png"
    pinned: true
    search: true
    align: center
    style: "docked"
    collapse-level: 1
    tools:
      - icon: github
        href: https://github.com/marco-willi/cas-dl-compvis-lectures
        text: "GitHub organization"
      - icon: code-square

    contents:
      - text: "Home"
        href: index.qmd
      # ------ Background & Preparation------------ #
      - section: Preparation
        contents:
          - pages/background/machine_learning.qmd
          - pages/background/neural_networks.qmd
          - pages/background/frameworks.qmd
      # ------ Lecture ---------------------------- #
      - section: Lectures
        contents:
          - pages/lectures/intro.qmd
          - pages/lectures/images_as_data.qmd
          - pages/lectures/cnns.qmd
          - pages/lectures/classification.qmd
          - pages/lectures/representation_learning.qmd
          - pages/lectures/downstream_adaptation.qmd
          - pages/lectures/vision_transformers.qmd
          - pages/lectures/genai_intro.qmd
          - pages/lectures/genai_models.qmd
          - pages/lectures/genai_practical.qmd
      # ------ SLIDES ---------------------------- #
      - section: Slides
        contents:
          - pages/slides/intro.qmd
          - pages/slides/images_as_data.qmd
          - pages/slides/cnns.qmd
          - pages/slides/classification.qmd
          - pages/slides/representation_learning.qmd
          - pages/slides/downstream_adaptation.qmd
          - pages/slides/vision_transformers.qmd
          - pages/slides/genai_intro.qmd
          - pages/slides/genai_models.qmd
          - pages/slides/genai_practical.qmd
      - section: Practice
        contents:
          - pages/misc/exercises.qmd
          - pages/misc/practical.qmd
          - pages/misc/quiz.qmd
          - pages/misc/student_projects.qmd
      # ------ Misc ---------------------------- #
      - section: Resources
        contents:
          - pages/misc/literature.qmd
          - pages/misc/links.qmd
          - pages/misc/notation.qmd
          - pages/misc/ai_coding_agents.qmd
          - pages/misc/tutor_prompt.qmd

bibliography: assets/references.bib

institute: "Institute for Data Science I4DS, FHNW"

format:
  html:
    theme: yeti
    css: styles.css
    toc: true
    code-fold: false
    code-tools: true
    highlight-style: github
  # pdf:
  #   include-in-header:
  #     - "./assets/_macros.tex"
