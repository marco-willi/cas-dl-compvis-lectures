<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker></defs><rect width="980" height="500" fill="white"/><text x="85.0" y="40" font-size="15" font-weight="bold" fill="#666666" text-anchor="middle" font-style="normal">Input</text><text x="285.0" y="40" font-size="15" font-weight="bold" fill="#666666" text-anchor="middle" font-style="normal">Understanding</text><text x="555.0" y="40" font-size="15" font-weight="bold" fill="#666666" text-anchor="middle" font-style="normal">Generation</text><text x="780.0" y="40" font-size="15" font-weight="bold" fill="#666666" text-anchor="middle" font-style="normal">Decoding</text><text x="915.0" y="40" font-size="15" font-weight="bold" fill="#666666" text-anchor="middle" font-style="normal">Output</text><line x1="20" y1="52" x2="960" y2="52" stroke="#cccccc" stroke-width="1"/><text x="20" y="88" font-size="16" font-weight="bold" fill="#222222" text-anchor="start" font-style="normal">1. Text-conditioned generator<tspan font-size="13" font-weight="normal" font-style="italic" fill="#666666">   e.g. Stable Diffusion, SD3</tspan></text><rect x="20" y="100" width="130" height="80" rx="8" fill="#f3f3f3" stroke="#6b6b6b" stroke-width="1.5"/><text x="85.0" y="145.25" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Prompt</text><line x1="150" y1="140.0" x2="188" y2="140.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="100" width="190" height="80" rx="8" fill="#dbe8f5" stroke="#6b6b6b" stroke-width="1.5"/><text x="285.0" y="135.75" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Text encoder</text><text x="285.0" y="154.75" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">often frozen</text><line x1="380" y1="140.0" x2="418" y2="140.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="100" width="270" height="80" rx="8" fill="#d9ead3" stroke="#6b6b6b" stroke-width="1.5"/><text x="555.0" y="135.75" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Latent diffusion / flow</text><text x="555.0" y="154.75" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">U-Net or DiT</text><line x1="690" y1="140.0" x2="728" y2="140.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="100" width="100" height="80" rx="8" fill="#f3f3f3" stroke="#6b6b6b" stroke-width="1.5"/><text x="780.0" y="135.75" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">VAE</text><text x="780.0" y="154.75" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">decoder</text><line x1="830" y1="140.0" x2="868" y2="140.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="870" y="105" width="90" height="70" rx="8" fill="white" stroke="#6b6b6b" stroke-width="1.5"/><text x="915.0" y="145.25" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Image</text><text x="20" y="228" font-size="16" font-weight="bold" fill="#222222" text-anchor="start" font-style="normal">2. Multimodal encoder + multimodal DiT<tspan font-size="13" font-weight="normal" font-style="italic" fill="#666666">   e.g. Qwen-Image 2.0, Seedream 4.0</tspan></text><rect x="20" y="240" width="130" height="80" rx="8" fill="#f3f3f3" stroke="#6b6b6b" stroke-width="1.5"/><text x="85.0" y="275.75" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Prompt</text><text x="85.0" y="294.75" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">+ input images</text><line x1="150" y1="280.0" x2="188" y2="280.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="240" width="190" height="80" rx="8" fill="#dbe8f5" stroke="#6b6b6b" stroke-width="1.5"/><text x="285.0" y="275.75" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Vision-language</text><text x="285.0" y="294.75" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">model (encoder)</text><line x1="380" y1="280.0" x2="418" y2="280.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="240" width="270" height="80" rx="8" fill="#d9ead3" stroke="#6b6b6b" stroke-width="1.5"/><text x="555.0" y="275.75" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Multimodal DiT</text><text x="555.0" y="294.75" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">condition + target jointly</text><line x1="690" y1="280.0" x2="728" y2="280.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="240" width="100" height="80" rx="8" fill="#f3f3f3" stroke="#6b6b6b" stroke-width="1.5"/><text x="780.0" y="275.75" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">VAE</text><text x="780.0" y="294.75" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">decoder</text><line x1="830" y1="280.0" x2="868" y2="280.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="870" y="245" width="90" height="70" rx="8" fill="white" stroke="#6b6b6b" stroke-width="1.5"/><text x="915.0" y="285.25" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Image</text><text x="20" y="368" font-size="16" font-weight="bold" fill="#222222" text-anchor="start" font-style="normal">3. Unified multimodal model<tspan font-size="13" font-weight="normal" font-style="italic" fill="#666666">   e.g. HunyuanImage 3.0</tspan></text><rect x="20" y="380" width="130" height="80" rx="8" fill="#f3f3f3" stroke="#6b6b6b" stroke-width="1.5"/><text x="85.0" y="415.75" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Prompt</text><text x="85.0" y="434.75" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">+ input images</text><line x1="150" y1="420.0" x2="188" y2="420.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><defs><linearGradient id="unified" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#dbe8f5"/><stop offset="1" stop-color="#d9ead3"/></linearGradient></defs><rect x="190" y="380" width="500" height="80" rx="8" fill="url(#unified)" stroke="#6b6b6b" stroke-width="1.5"/><text x="440.0" y="406.25" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">One LLM-style transformer</text><text x="440.0" y="425.25" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">text tokens: next-token prediction</text><text x="440.0" y="444.25" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">image latents: diffusion</text><line x1="690" y1="420.0" x2="728" y2="420.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="380" width="100" height="80" rx="8" fill="#f3f3f3" stroke="#6b6b6b" stroke-width="1.5"/><text x="780.0" y="415.75" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">VAE</text><text x="780.0" y="434.75" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">decoder</text><line x1="830" y1="420.0" x2="868" y2="420.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><rect x="870" y="385" width="90" height="70" rx="8" fill="white" stroke="#6b6b6b" stroke-width="1.5"/><text x="915.0" y="425.25" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle" font-style="normal">Image</text><text x="490.0" y="482" font-size="13" font-weight="normal" fill="#666666" text-anchor="middle" font-style="italic">Simplified patterns, not exact diagrams of the named models.</text></svg>
