<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker></defs><rect width="1000" height="430" fill="white"/><text x="330" y="38" font-size="17" font-weight="bold" fill="#666666" text-anchor="middle" font-style="normal">Generation</text><text x="520" y="38" font-size="17" font-weight="bold" fill="#666666" text-anchor="middle" font-style="normal">Sharing</text><text x="710" y="38" font-size="17" font-weight="bold" fill="#666666" text-anchor="middle" font-style="normal">Viewing</text><text x="870" y="38" font-size="17" font-weight="bold" fill="#666666" text-anchor="middle" font-style="normal">Breaks when</text><line x1="20" y1="52" x2="980" y2="52" stroke="#cccccc" stroke-width="1"/><text x="20" y="100" font-size="18" font-weight="bold" fill="#222222" text-anchor="start" font-style="normal">Watermark</text><text x="20" y="122" font-size="14" font-weight="normal" fill="#666666" text-anchor="start" font-style="italic">visible / invisible</text><line x1="330" y1="104" x2="710" y2="104" stroke="#0072b2" stroke-width="3" stroke-dasharray="8 6"/><circle cx="330" cy="104" r="11" fill="#0072b2"/><circle cx="710" cy="104" r="11" fill="#0072b2"/><path d="M 511 95 L 529 113 M 529 95 L 511 113" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><text x="870" y="100" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">re-photographed, cropped</text><text x="870" y="120" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">or edited</text><text x="20" y="178" font-size="18" font-weight="bold" fill="#222222" text-anchor="start" font-style="normal">Metadata</text><text x="20" y="200" font-size="14" font-weight="normal" fill="#666666" text-anchor="start" font-style="italic">content credentials</text><line x1="330" y1="182" x2="710" y2="182" stroke="#0072b2" stroke-width="3" stroke-dasharray="8 6"/><circle cx="330" cy="182" r="11" fill="#0072b2"/><circle cx="710" cy="182" r="11" fill="#0072b2"/><path d="M 511 173 L 529 191 M 529 173 L 511 191" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><text x="870" y="178" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">stripped by screenshots</text><text x="870" y="198" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">or platforms</text><text x="20" y="256" font-size="18" font-weight="bold" fill="#222222" text-anchor="start" font-style="normal">Signature</text><text x="20" y="278" font-size="14" font-weight="normal" fill="#666666" text-anchor="start" font-style="italic">cryptographic</text><line x1="330" y1="260" x2="710" y2="260" stroke="#0072b2" stroke-width="3" stroke-dasharray="8 6"/><circle cx="330" cy="260" r="11" fill="#0072b2"/><circle cx="710" cy="260" r="11" fill="#0072b2"/><text x="870" y="256" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">proves only what was signed;</text><text x="870" y="276" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">unsigned is not fake</text><text x="20" y="334" font-size="18" font-weight="bold" fill="#222222" text-anchor="start" font-style="normal">Detector</text><text x="20" y="356" font-size="14" font-weight="normal" fill="#666666" text-anchor="start" font-style="italic">synthetic-image classifier</text><circle cx="710" cy="338" r="11" fill="#0072b2"/><path d="M 725 329 L 743 347 M 743 329 L 725 347" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><text x="870" y="334" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">new generators,</text><text x="870" y="354" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle" font-style="normal">distribution shift</text><circle cx="250" cy="403" r="8" fill="#0072b2"/><text x="266" y="408" font-size="14" font-weight="normal" fill="#222222" text-anchor="start" font-style="normal">acts here</text><path d="M 395 396 L 409 410 M 409 396 L 395 410" stroke="#c0392b" stroke-width="3"/><text x="420" y="408" font-size="14" font-weight="normal" fill="#222222" text-anchor="start" font-style="normal">typically breaks here</text><text x="620" y="408" font-size="14" font-weight="normal" fill="#666666" text-anchor="start" font-style="italic">None is perfect: combine them.</text></svg>
